[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "citysmith"
version = "0.1.0"
description = "Command line toolkit for CityGML 2.0 buildings: derive lower LODs, complete semantics, validate, crop, merge and convert to CityJSON."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "banecronotse" }]
keywords = ["citygml", "lod", "3d-city-models", "gis", "gml", "level-of-detail", "cityjson",
            "validation", "semantic-enrichment"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = ["lxml>=4.9"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/banecronotse/CitySmith"
Issues = "https://github.com/banecronotse/CitySmith/issues"

[project.scripts]
citysmith = "citysmith.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/citysmith"]
artifacts = ["src/citysmith/data/*.yml"]

[tool.ruff]
line-length = 100
